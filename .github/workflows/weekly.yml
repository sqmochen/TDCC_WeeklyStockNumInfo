name: TDCC 大戶持股比週報
# WORKFLOW_VERSION: v4

on:
  schedule:
    # 每週日台灣時間 09:00 執行（UTC+8，換算為 UTC 01:00）
    - cron: '0 1 * * 0'
  workflow_dispatch:
    # 允許手動在 GitHub 網頁上觸發執行（用於測試或補跑）

jobs:
  run-weekly-report:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 取出 repo 最新內容
        uses: actions/checkout@v4

      - name: 確認 Workflow 版本與執行環境
        run: |
          echo "============================================"
          echo "  WORKFLOW_VERSION: v4"
          echo "  Commit SHA : $GITHUB_SHA"
          echo "  Branch     : $GITHUB_REF_NAME"
          echo "  Run ID     : $GITHUB_RUN_ID"
          echo "  Run Number : $GITHUB_RUN_NUMBER"
          echo "  Triggered  : $GITHUB_EVENT_NAME"
          echo "  Date (UTC) : $(date +'%Y-%m-%d %H:%M:%S')"
          echo "============================================"
          echo ""
          echo "[版本確認] 預期版本：v4（含 set+e retry loop，無 TZ date 參數）"
          # 確認 workflow 檔案中確實含有版本標記
          if grep -q "WORKFLOW_VERSION: v4" .github/workflows/weekly.yml; then
            echo "✅ Workflow 版本確認正確：v4"
          else
            echo "❌ 警告：Workflow 檔案版本標記不符，可能使用了快取版本"
            exit 1
          fi

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝必要套件
        run: pip install -r requirements.txt

      - name: 建立輸出資料夾
        run: mkdir -p output/raw output/data output/summary

      - name: 執行 TDCC 週報腳本
        run: python tdcc_weekly.py

      - name: 將產出結果存回 GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 備份 Python 產出的檔案（後續 reset 前先保留）
          mkdir -p /tmp/tdcc_out
          cp -r output/data output/summary /tmp/tdcc_out/ 2>/dev/null || true

          # 重試迴圈：每次都 fetch 最新 remote，reset 後 commit 再 push
          set +e
          SUCCESS=false
          for attempt in 1 2 3 4 5; do
            echo "=== Push 嘗試 ${attempt}/5 ==="
            git fetch origin
            git reset --hard origin/${GITHUB_REF_NAME}
            mkdir -p output/data output/summary
            cp -r /tmp/tdcc_out/data/. output/data/
            cp -r /tmp/tdcc_out/summary/. output/summary/
            git add output/data/ output/summary/
            if git diff --staged --quiet; then
              echo "output 檔案無變動，視為成功"
              SUCCESS=true
              break
            fi
            git commit -m "自動更新：TDCC 週報 $(date +'%Y-%m-%d')"
            if git push origin HEAD:${GITHUB_REF_NAME}; then
              SUCCESS=true
              break
            fi
            echo "Push 失敗，等待 20 秒後重試（讓 remote 更新完成）..."
            sleep 20
          done
          set -e

          if [ "${SUCCESS}" != "true" ]; then
            echo "❌ 所有 push 嘗試均失敗"
            exit 1
          fi
