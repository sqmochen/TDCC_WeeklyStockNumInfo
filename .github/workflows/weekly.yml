name: TDCC 大戶持股比週報

on:
  schedule:
    # 每週日台灣時間 09:00 執行（UTC+8，換算為 UTC 01:00）
    - cron: '0 1 * * 0'
  workflow_dispatch:
    # 允許手動在 GitHub 網頁上觸發執行（用於測試或補跑）

jobs:
  run-weekly-report:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 取出 repo 最新內容
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝必要套件
        run: pip install -r requirements.txt

      - name: 建立輸出資料夾
        run: mkdir -p output/raw output/data output/summary

      - name: 執行 TDCC 週報腳本
        run: python tdcc_weekly.py

      - name: 將產出結果存回 GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/data/
          git add output/summary/
          git diff --staged --quiet || git commit -m "自動更新：TDCC 週報 $(TZ=Asia/Taipei date +'%Y-%m-%d')"
          # 重試迴圈：每次重新 fetch + rebase 再 push，最多嘗試 5 次
          for i in 1 2 3 4 5; do
            echo "=== Push 嘗試 $i/5 ==="
            git fetch origin ${GITHUB_REF_NAME}
            git rebase origin/${GITHUB_REF_NAME} || git rebase --abort
            git push origin HEAD:${GITHUB_REF_NAME} && break
            [ $i -lt 5 ] && sleep $((i * 10)) || exit 1
          done
