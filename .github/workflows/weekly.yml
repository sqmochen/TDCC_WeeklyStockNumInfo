name: TDCC 大戶持股比週報

on:
  schedule:
    # 每週日台灣時間 09:00 執行（UTC+8，換算為 UTC 01:00）
    - cron: '0 1 * * 0'
  workflow_dispatch:
    # 允許手動在 GitHub 網頁上觸發執行（用於測試或補跑）

jobs:
  run-weekly-report:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 取出 repo 最新內容
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝必要套件
        run: pip install -r requirements.txt

      - name: 建立輸出資料夾
        run: mkdir -p output/raw output/data output/summary

      - name: 執行 TDCC 週報腳本
        run: python tdcc_weekly.py

      - name: 將產出結果存回 GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # 先備份 Python 產生的輸出檔（reset 前）
          mkdir -p /tmp/tdcc_output
          cp -r output/data output/summary /tmp/tdcc_output/ 2>/dev/null || true
          # 取得最新 remote 狀態，reset 到 remote HEAD（避免 rebase 競爭問題）
          git fetch origin
          git reset --hard origin/${GITHUB_REF_NAME}
          # 還原輸出檔
          mkdir -p output/data output/summary
          cp -r /tmp/tdcc_output/data/. output/data/ 2>/dev/null || true
          cp -r /tmp/tdcc_output/summary/. output/summary/ 2>/dev/null || true
          # Commit（若有新資料）並 fast-forward push
          git add output/data/ output/summary/
          git diff --staged --quiet || git commit -m "自動更新：TDCC 週報 $(TZ=Asia/Taipei date +'%Y-%m-%d')"
          git push origin HEAD:${GITHUB_REF_NAME}
